[project]
name = "gridless"
version = "0.1.0"
description = "Turn a folder of messy spreadsheets into a working internal web app"
requires-python = ">=3.12,<3.15"
dependencies = [
    "django>=5.1,<6.1",
    "django-bolt>=0.10",
    "openpyxl>=3.1",
    "psycopg[binary,pool]>=3.2",
    "sqlglot>=27.0",
    "langgraph>=0.3",
    "langgraph-checkpoint-postgres>=2.0",
    "langchain-core>=0.3",
    "langchain-openrouter>=0.1",
    "python-dotenv>=1.0",
    "deepagents>=0.7.13",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-django>=4.9",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "gridless.settings"
python_files = ["test_*.py"]
testpaths = ["tests"]

[tool.uv]
package = false
